<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QQQLANG</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@200..900&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'QQQLANG';
      src: url('./QQQLANG.ttf') format('truetype');
      font-weight: 300 700;
      font-style: normal;
      font-display: swap;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Inconsolata", monospace;
      font-weight: 300;
      background: #000;
    }
    
    #app {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }
    
    #input-container {
      flex-shrink: 0;
      padding: 10px 10px 0 10px;
      background: #000;
      display: flex;
      gap: 10px;
      align-items: stretch;
    }
    
    #logo {
      height: 44px;
      width: auto;
      align-self: center;
    }
    
    #help-container {
      position: absolute;
      top: 59px;
      left: 10px;
      right: 10px;
      padding: 5px;
      font-family: "Inconsolata", monospace;
      font-weight: 300;
      font-size: 16px;
      color: #E8E4DC;
      line-height: 1.2;
      font-variant-ligatures: none;
      word-break: break-all;
      overflow-wrap: anywhere;
      text-shadow: 
        -1px -1px 0 #000,
        1px -1px 0 #000,
        -1px 1px 0 #000,
        1px 1px 0 #000,
        0 0 3px #000;
      pointer-events: none;
      z-index: 10;
    }
    
    #help-container .fn-name {
      font-weight: bold;
    }
    
    #help-container .fn-char {
      color: #888;
      text-shadow: 
        -1px -1px 0 #000,
        1px -1px 0 #000,
        -1px 1px 0 #000,
        1px 1px 0 #000,
        0 0 3px #000;
    }
    
    @media (max-width: 600px) {
      #help-container {
        display: none;
      }
    }
    
    @keyframes gradient-rotate {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(360deg); }
    }
    
    #input-wrapper {
      position: relative;
      flex: 1;
    }
    
    #input-wrapper::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border: 2px solid transparent;
      background: 
        linear-gradient(#1a1a1a, #1a1a1a) padding-box,
        linear-gradient(
          45deg,
          #E61A1A 0%,
          #1AE61A 33%,
          #1A1AE6 66%,
          #E61A1A 100%
        ) border-box;
      pointer-events: none;
      z-index: 0;
    }
    
    #input-wrapper:focus-within::before {
      background: 
        linear-gradient(#1a1a1a, #1a1a1a) padding-box,
        linear-gradient(
          45deg,
          #E61A1A 0%,
          #E6E61A 16.6%,
          #1AE61A 33.3%,
          #1AE6E6 50%,
          #1A1AE6 66.6%,
          #E61AE6 83.3%,
          #E61A1A 100%
        ) border-box;
      animation: gradient-rotate 8s linear infinite;
    }
    
    #program-input {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 10px 15px;
      font-size: 22px;
      font-family: "QQQLANG", "Inconsolata", monospace;
      font-weight: 300;
      border: 2px solid transparent;
      background: #1a1a1a;
      color: #fff;
      caret-color: #fff;
      outline: none;
      z-index: 2;
    }
    
    .toolbar-button {
      position: relative;
      padding: 10px 15px;
      font-size: 18px;
      font-family: "Inconsolata", monospace;
      font-weight: 300;
      border: 2px solid transparent;
      background: 
        linear-gradient(#1a1a1a, #1a1a1a) padding-box,
        linear-gradient(
          45deg,
          #1AE6E6 0%,
          #1A1AE6 100%
        ) border-box;
      color: #fff;
      cursor: pointer;
      white-space: nowrap;
      min-width: 90px;
      width: 90px;
      text-align: center;
    }
    
    #upload-button {
      background: 
        linear-gradient(#1a1a1a, #1a1a1a) padding-box,
        linear-gradient(
          45deg,
          #E61AE6 0%,
          #E61A1A 100%
        ) border-box;
    }
    
    #download-button {
      background: 
        linear-gradient(#1a1a1a, #1a1a1a) padding-box,
        linear-gradient(
          45deg,
          #E61A1A 0%,
          #E6E61A 100%
        ) border-box;
    }
    
    #help-button {
      background: 
        linear-gradient(#1a1a1a, #1a1a1a) padding-box,
        linear-gradient(
          45deg,
          #1AE61A 0%,
          #1AE6E6 100%
        ) border-box;
    }
    
    #upload-button {
      width: 90px;
    }
    
    #download-button {
      width: 100px;
    }
    
    .toolbar-button:hover:not(:disabled) {
      filter: brightness(1.3);
    }
    
    .toolbar-button:active:not(:disabled) {
      filter: brightness(1.5);
    }
    
    .toolbar-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    #upload-button:disabled {
      opacity: 1;
      background: 
        linear-gradient(#1a1a1a, #1a1a1a) padding-box,
        linear-gradient(
          45deg,
          #730D73 0%,
          #730D0D 100%
        ) border-box;
      color: #666;
    }
    
    .toolbar-button .btn-icon {
      display: none;
    }
    
    .toolbar-button .btn-text {
      text-transform: uppercase;
    }
    
    .toolbar-button .btn-indicator.math {
      color: #888;
      text-transform: lowercase;
    }
    
    .toolbar-button .btn-rainbow {
      background: linear-gradient(to bottom, 
        #ff0000, #ff8000, #ffff00, #00ff00, #0080ff, #8000ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: bold;
    }
    
    @media (max-width: 600px) {
      .toolbar-button .btn-text {
        display: none;
      }
      .toolbar-button .btn-icon {
        display: inline;
        font-size: 18px;
      }
      .toolbar-button {
        padding: 10px 12px;
        min-width: 44px;
        width: 44px;
      }
      #upload-button, #download-button {
        width: 44px;
      }
    }
    
    #canvas-container {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
      margin-top: 10px;
      background: #000;
    }
    
    #canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
    }
    
    #debug-pane {
      position: fixed;
      top: 60px;
      right: 10px;
      bottom: 10px;
      width: 400px;
      background: rgba(0, 0, 0, 0.8);
      color: #E8E4DC;
      padding: 15px;
      font-family: "Inconsolata", monospace;
      font-weight: 300;
      font-size: 14px;
      overflow-y: auto;
      z-index: 9;
      border: 1px solid #333;
      display: none;
    }
    
    #debug-pane.visible {
      display: block;
    }
    
    #debug-pane .op {
      margin-bottom: 3px;
      padding: 2px 5px;
      color: #E8E4DC;
    }
    
    #debug-pane .op:hover {
      background: rgba(232, 228, 220, 0.1);
    }
    
    @keyframes bell-flash {
      0% { background-color: rgba(255, 0, 0, 0.3); }
      100% { background-color: transparent; }
    }
    
    #input-container.bell {
      animation: bell-flash 0.15s ease-out;
    }
    
    #app.intro-active {
      opacity: 0;
    }
    
    #app.intro-fading {
      transition: opacity 1s ease-out;
    }
    
    #intro-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 1000;
      transition: opacity 1s ease-out;
    }
    
    #intro-overlay.fading {
      opacity: 0;
      pointer-events: none;
    }
    
    #intro-overlay.hidden {
      display: none;
    }
    
    #intro-poster {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }
    
    #intro-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 2;
      opacity: 0;
      transition: opacity 0.3s ease-in;
    }
    
    #intro-video.visible {
      opacity: 1;
    }
    
  </style>
</head>
<body>
  <div id="app" class="intro-active">
    <div id="input-container">
      <img src="logo.png" alt="QQQLANG" id="logo">
      <div id="input-wrapper">
        <input type="text" id="program-input" placeholder="ENTER PROGRAM (E.G., ACJ!H)" autofocus autocomplete="off">
      </div>
      <button id="upload-button" class="toolbar-button" disabled>
        <span class="btn-text"><span class="btn-indicator math">fn</span></span>
        <span class="btn-icon">fn</span>
      </button>
      <button id="download-button" class="toolbar-button"><span class="btn-text">Download</span><span class="btn-icon">⬇</span></button>
      <button id="help-button" class="toolbar-button"><span class="btn-text">Help</span><span class="btn-icon">?</span></button>
    </div>
    <div id="canvas-container">
      <canvas id="canvas"></canvas>
    </div>
  </div>
  <div id="help-container"></div>
  <div id="debug-pane"></div>
  
  <div id="intro-overlay" class="hidden">
    <img id="intro-poster" src="" alt="">
    <video id="intro-video" playsinline webkit-playsinline muted autoplay></video>
  </div>
  
  <input type="file" id="file-input" accept="image/*" style="display: none;">

  <script type="module">
    import { runProgram, getParsedOperations, getExpectedNextType, getExpectedTypeAtPosition, addUploadedBlob, setUploadedBlob, preloadUploadedImages, clearUploadedImages } from './runtime.ts';
    import { characterDefs, emeraldReady, bgRemovalReady, UPLOAD_CHAR, ChoiceType, formatFunctionHelp } from './character-defs.ts';

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const input = document.getElementById('program-input');
    const inputContainer = document.getElementById('input-container');
    const debugPane = document.getElementById('debug-pane');
    const helpButton = document.getElementById('help-button');
    const downloadButton = document.getElementById('download-button');
    const uploadButton = document.getElementById('upload-button');
    const fileInput = document.getElementById('file-input');
    const helpContainer = document.getElementById('help-container');

    const introOverlay = document.getElementById('intro-overlay');
    const introVideo = document.getElementById('intro-video');
    const introPoster = document.getElementById('intro-poster');
    const app = document.getElementById('app');

    let helpHideTimeout = null;

    const isDebugMode = window.location.search.includes('debug');
    if (isDebugMode) {
      debugPane.classList.add('visible');
    }
    
    const INTRO_SEEN_KEY = 'qqqlang-intro-seen';
    const INTRO_DURATION_MS = 4000;
    const FADE_DURATION_MS = 1000;
    const UPLOAD_WORKER_URL = 'https://qqqlang-upload-worker.andreas-s-t-jansson.workers.dev';
    const HASH_LENGTH = 22;
    
    let pendingUploadIndex = null;
    const uploadHashes = [];
    
    async function handleImageUpload(blob, insertAtCursor = true) {
      console.log('[handleImageUpload] blob size:', blob.size, 'type:', blob.type, 'pendingUploadIndex:', pendingUploadIndex);
      
      let hash = null;
      try {
        hash = await uploadImageToWorker(blob);
        console.log('[handleImageUpload] got hash:', hash);
      } catch (err) {
        console.error('Upload to server failed:', err);
      }
      
      if (pendingUploadIndex !== null) {
        console.log('[handleImageUpload] REPLACING upload at index', pendingUploadIndex);
        uploadHashes[pendingUploadIndex] = hash;
        setUploadedBlob(pendingUploadIndex, blob);
        pendingUploadIndex = null;
      } else {
        console.log('[handleImageUpload] ADDING new upload');
        
        if (insertAtCursor) {
          const start = input.selectionStart;
          // Count how many □ chars are before the cursor - this is where we insert in the arrays
          const insertIndex = getUploadCharIndex(input.value, start);
          console.log('[handleImageUpload] inserting at array index', insertIndex, 'cursor at', start);
          
          // Insert hash and blob at the correct position
          uploadHashes.splice(insertIndex, 0, hash);
          insertUploadedBlob(insertIndex, blob);
          
          const before = input.value.substring(0, start);
          const after = input.value.substring(input.selectionEnd);
          input.value = before + UPLOAD_CHAR + after;
          input.selectionStart = input.selectionEnd = start + UPLOAD_CHAR.length;
        } else {
          // Not inserting at cursor, just append
          uploadHashes.push(hash);
          addUploadedBlob(blob);
        }
      }
      
      console.log('[handleImageUpload] uploadHashes:', uploadHashes);
      updateURL(input.value);
      await render();
      input.focus();
    }
    
    async function uploadImageToWorker(file) {
      const response = await fetch(`${UPLOAD_WORKER_URL}/upload`, {
        method: 'POST',
        headers: { 'Content-Type': file.type },
        body: file
      });
      if (!response.ok) {
        throw new Error(`Upload failed: ${response.status}`);
      }
      const data = await response.json();
      return data.hash;
    }
    
    async function fetchImageAsBlob(hash) {
      const response = await fetch(`${UPLOAD_WORKER_URL}/image/${hash}`);
      if (!response.ok) return null;
      return await response.blob();
    }
    
    function isValidProgramChar(char) {
      const upper = char.toUpperCase();
      return upper in characterDefs || char === UPLOAD_CHAR;
    }
    
    function parseProgram(urlProgram) {
      const hashes = [];
      let displayProgram = '';
      let hadInvalidChars = false;
      const chars = [...urlProgram];
      let i = 0;
      while (i < chars.length) {
        if (chars[i] === UPLOAD_CHAR) {
          displayProgram += UPLOAD_CHAR;
          const hashChars = chars.slice(i + 1, i + 1 + HASH_LENGTH).join('');
          if (hashChars.length === HASH_LENGTH && /^[A-Za-z0-9_-]+$/.test(hashChars)) {
            hashes.push(hashChars);
            i += 1 + HASH_LENGTH;
          } else {
            hashes.push(null);
            i++;
          }
        } else {
          const char = chars[i].toUpperCase();
          if (isValidProgramChar(char)) {
            displayProgram += char;
          } else {
            hadInvalidChars = true;
          }
          i++;
        }
      }
      return { displayProgram, hashes, hadInvalidChars };
    }
    
    function buildUrlProgram(displayProgram) {
      const chars = [...displayProgram];
      let result = '';
      let uploadIdx = 0;
      for (const char of chars) {
        result += char;
        if (char === UPLOAD_CHAR) {
          if (uploadIdx < uploadHashes.length && uploadHashes[uploadIdx]) {
            result += uploadHashes[uploadIdx];
          }
          uploadIdx++;
        }
      }
      return result;
    }
    
    function shouldShowIntro() {
      const params = new URLSearchParams(window.location.search);
      if (params.has('show-intro')) return true;
      if (params.has('p')) return false;
      if (localStorage.getItem(INTRO_SEEN_KEY)) return false;
      return true;
    }
    
    let modelsReady = null;
    
    function showIntro() {
      // Show poster immediately
      introPoster.src = 'intro-poster.jpg';
      introOverlay.classList.remove('hidden');
      
      // Load and fade in video
      // Set up event listener before setting src to avoid race condition
      const onCanPlay = () => {
        introVideo.play().then(() => {
          introVideo.classList.add('visible');
        }).catch(() => {
          // If autoplay fails, just show the poster
          console.log('Video autoplay failed, showing poster only');
        });
      };
      
      introVideo.addEventListener('canplay', onCanPlay, { once: true });
      
      // For iOS: also try playing on loadedmetadata
      introVideo.addEventListener('loadedmetadata', () => {
        introVideo.play().then(() => {
          introVideo.classList.add('visible');
        }).catch(() => {});
      }, { once: true });
      
      introVideo.loop = true;
      introVideo.muted = true;
      introVideo.playsInline = true;
      introVideo.src = 'intro.mp4';
      introVideo.load();
      
      setTimeout(async () => {
        // Wait for models to be ready before starting fade
        if (modelsReady) {
          await modelsReady;
        }
        
        // Render the app before showing it
        input.value = '';
        updateURL('');
        await render();
        
        // Start fading out intro and fading in app simultaneously
        introOverlay.classList.add('fading');
        app.classList.add('intro-fading');
        app.classList.remove('intro-active');
        
        localStorage.setItem(INTRO_SEEN_KEY, 'true');
        
        // Clean up after fade completes
        setTimeout(() => {
          introOverlay.classList.add('hidden');
          introVideo.pause();
          introVideo.src = '';
          introPoster.src = '';
          input.focus();
        }, FADE_DURATION_MS);
      }, INTRO_DURATION_MS);
    }
    
    function visualBell() {
      inputContainer.classList.remove('bell');
      void inputContainer.offsetWidth;
      inputContainer.classList.add('bell');
    }
    
    function isValidChar(char) {
      return char in characterDefs || char === UPLOAD_CHAR;
    }
    
    function completeProgram(program) {
      if (!program) return program;
      const ops = getParsedOperations(program);
      if (ops.length === 0) return program;
      
      const lastOp = ops[ops.length - 1];
      if (lastOp.type === 'function') {
        const def = lastOp.fnDef;
        const prevIdentifier = ops.length > 1 ? ops[ops.length - 2].identifier : '';
        const currentOpChars = [...lastOp.identifier.substring(prevIdentifier.length)];
        const argsProvided = currentOpChars.length - 1;
        const argsNeeded = def.arity - argsProvided;
        
        if (argsNeeded > 0) {
          const fnChar = currentOpChars[0];
          for (let i = 0; i < argsNeeded; i++) {
            program += fnChar;
          }
        }
      }
      return program;
    }
    
    function updateHelpDisplay() {
      // Clear any pending hide timeout
      if (helpHideTimeout) {
        clearTimeout(helpHideTimeout);
        helpHideTimeout = null;
      }
      
      const program = input.value || '';
      const cursorPos = input.selectionStart ?? program.length;
      
      // Only show help if cursor is at the end of the program
      if (cursorPos !== program.length) {
        helpContainer.innerHTML = '';
        return;
      }
      
      if (!program) {
        helpContainer.innerHTML = '';
        return;
      }
      
      const ops = getParsedOperations(program);
      if (ops.length === 0) {
        helpContainer.innerHTML = '';
        return;
      }
      
      const lastOp = ops[ops.length - 1];
      
      if (lastOp.type !== 'function') {
        helpContainer.innerHTML = '';
        return;
      }
      
      const def = lastOp.fnDef;
      
      // Check if function is complete (has all arguments)
      const prevIdentifier = ops.length > 1 ? ops[ops.length - 2].identifier : '';
      const currentOpChars = [...lastOp.identifier.substring(prevIdentifier.length)];
      const argsProvided = currentOpChars.length - 1; // Subtract 1 for the function character itself
      
      const char = [...lastOp.identifier].find(c => characterDefs[c] && characterDefs[c] === def) || '?';
      const helpLines = formatFunctionHelp(char, def);
      
      // If function has no args (arity 0), show help briefly then hide after 1 second
      if (def.args.length === 0 && argsProvided === 0) {
        helpContainer.innerHTML = `<div>${helpLines[0]}</div>`;
        
        helpHideTimeout = setTimeout(() => {
          helpContainer.innerHTML = '';
          helpHideTimeout = null;
        }, 1000);
        return;
      }
      
      if (argsProvided >= def.args.length) {
        // Function is complete, don't show help
        helpContainer.innerHTML = '';
        return;
      }
      
      helpContainer.innerHTML = helpLines.map(line => `<div>${line}</div>`).join('');
    }
    
    function updateUploadButtonState() {
      const cursorPos = input.selectionStart ?? input.value.length;
      const expectedType = getExpectedTypeAtPosition(input.value, cursorPos);
      const btnText = uploadButton.querySelector('.btn-text .btn-indicator');
      const btnIcon = uploadButton.querySelector('.btn-icon');
      
      if (expectedType === 'initial' || expectedType === 'index') {
        uploadButton.disabled = false;
        btnText.className = 'btn-indicator';
        btnText.textContent = 'Upload';
        btnIcon.textContent = '📷';
      } else if (expectedType === 'function') {
        uploadButton.disabled = true;
        btnText.className = 'btn-indicator math';
        btnText.textContent = 'fn';
        btnIcon.textContent = 'fn';
      } else if (expectedType === 'int') {
        uploadButton.disabled = true;
        btnText.className = 'btn-indicator math';
        btnText.textContent = 'x';
        btnIcon.textContent = 'x';
      } else if (expectedType === 'color') {
        uploadButton.disabled = true;
        btnText.className = 'btn-indicator btn-rainbow';
        btnText.textContent = '■';
        btnIcon.textContent = '🌈';
      }
    }
    
    
    function getUploadCharIndex(str, charPosition) {
      let uploadIndex = 0;
      const chars = [...str];
      for (let i = 0; i < charPosition && i < chars.length; i++) {
        if (chars[i] === UPLOAD_CHAR) {
          uploadIndex++;
        }
      }
      return uploadIndex;
    }
    
    uploadButton.addEventListener('click', () => {
      const cursorPos = input.selectionStart ?? input.value.length;
      const expectedType = getExpectedTypeAtPosition(input.value, cursorPos);
      if (expectedType === 'initial' || expectedType === 'index') {
        const chars = [...input.value];
        const charAtCursor = chars[cursorPos];
        const charBeforeCursor = cursorPos > 0 ? chars[cursorPos - 1] : null;
        
        if (charAtCursor === UPLOAD_CHAR) {
          // Cursor is on a □, replace this upload
          // getUploadCharIndex returns count of □ before position, so this gives us the 0-based index
          pendingUploadIndex = getUploadCharIndex(input.value, cursorPos);
        } else if (charBeforeCursor === UPLOAD_CHAR) {
          // Cursor is right after a □, replace that upload
          pendingUploadIndex = getUploadCharIndex(input.value, cursorPos - 1);
        } else {
          // Not on an existing upload, add new one
          pendingUploadIndex = null;
        }
        
        fileInput.click();
      }
    });
    
    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      console.log('[fileInput.change] file:', file?.name, 'size:', file?.size, 'type:', file?.type);
      fileInput.value = '';
      if (!file) return;
      
      await handleImageUpload(file);
    });
    
    helpButton.addEventListener('click', () => {
      let program = input.value;
      if (!program) {
        program = 'A';
      }
      program = completeProgram(program);
      program += '??';
      input.value = program;
      updateURL(program);
      render();
      input.focus();
    });
    
    downloadButton.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'qqqlang-' + (input.value || 'empty') + '.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    function getProgramFromURL() {
      const params = new URLSearchParams(window.location.search);
      return params.get('p') || '';
    }

    function updateURL(displayProgram) {
      const urlProgram = buildUrlProgram(displayProgram);
      const params = new URLSearchParams(window.location.search);
      if (urlProgram) {
        params.set('p', urlProgram);
      } else {
        params.delete('p');
      }
      const newSearch = params.toString();
      const newURL = window.location.pathname + (newSearch ? '?' + newSearch : '');
      if (window.location.pathname + window.location.search !== newURL) {
        window.history.pushState({ program: urlProgram }, '', newURL);
      }
    }

    function updateDebugPane(program) {
      if (!isDebugMode) return;
      
      const ops = getParsedOperations(program);
      
      let html = '';
      
      for (let i = ops.length - 1; i >= 0; i--) {
        const op = ops[i];
        const prevIdentifier = i > 0 ? ops[i - 1].identifier : '';
        const opChars = op.identifier.substring(prevIdentifier.length);
        
        if (op.type === 'solid') {
          html += `<div class="op">[${i}] "${opChars}" initial-color(${op.color})</div>`;
        } else if (op.type === 'uploaded-image') {
          html += `<div class="op">[${i}] "${opChars}" uploaded-image(${op.uploadIndex})</div>`;
        } else {
          const argsStr = op.args.length > 0 ? op.args.map(a => 
            typeof a === 'object' ? `upload:${a.index}` : a
          ).join(', ') : '';
          html += `<div class="op">[${i}] "${opChars}" ${op.fnDef.functionName}(${argsStr})</div>`;
        }
      }
      
      debugPane.innerHTML = html;
    }



    function resize() {
      const container = document.getElementById('canvas-container');
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
      render();
    }

    function updateFaviconAndTitle(program) {
      let favicon = document.getElementById('dynamic-favicon');
      if (!favicon) {
        favicon = document.createElement('link');
        favicon.id = 'dynamic-favicon';
        favicon.rel = 'icon';
        favicon.type = 'image/png';
        document.head.appendChild(favicon);
      }
      
      if (program) {
        document.title = 'QQQLANG - ' + program;
        
        const size = Math.min(canvas.width, canvas.height);
        const x = Math.floor((canvas.width - size) / 2);
        const y = Math.floor((canvas.height - size) / 2);
        
        const faviconCanvas = document.createElement('canvas');
        faviconCanvas.width = 32;
        faviconCanvas.height = 32;
        const faviconCtx = faviconCanvas.getContext('2d');
        faviconCtx.drawImage(canvas, x, y, size, size, 0, 0, 32, 32);
        
        favicon.href = faviconCanvas.toDataURL('image/png');
      } else {
        document.title = 'QQQLANG';
        favicon.href = 'favicon-32.png';
      }
    }
    
    async function render() {
      const program = input.value || '';
      
      await preloadUploadedImages(canvas.width, canvas.height);
      
      const images = await runProgram(program, canvas.width, canvas.height);
      const finalImage = images[images.length - 1];
      
      const imageData = new ImageData(finalImage.data, finalImage.width, finalImage.height);
      ctx.putImageData(imageData, 0, 0);
      
      updateDebugPane(program);
      updateFaviconAndTitle(program);
      updateUploadButtonState();
      updateHelpDisplay();
    }

    async function loadProgramFromURL() {
      const urlProgram = getProgramFromURL();
      const { displayProgram, hashes, hadInvalidChars } = parseProgram(urlProgram);
      
      clearUploadedImages();
      uploadHashes.length = 0;
      
      // Track which upload indices have valid hashes
      const validUploadIndices = new Set();
      
      for (let i = 0; i < hashes.length; i++) {
        const hash = hashes[i];
        if (hash) {
          const blob = await fetchImageAsBlob(hash);
          if (blob) {
            uploadHashes.push(hash);
            addUploadedBlob(blob);
            validUploadIndices.add(i);
          }
        }
      }
      
      // Remove upload chars that had invalid/missing hashes
      let cleanedProgram = '';
      let uploadIdx = 0;
      for (const char of displayProgram) {
        if (char === UPLOAD_CHAR) {
          if (validUploadIndices.has(uploadIdx)) {
            cleanedProgram += char;
          }
          uploadIdx++;
        } else {
          cleanedProgram += char;
        }
      }
      
      input.value = cleanedProgram;
      
      // Redirect to clean URL if there were invalid characters or invalid hashes
      const hadInvalidHashes = validUploadIndices.size < hashes.length;
      if (hadInvalidChars || hadInvalidHashes) {
        updateURL(cleanedProgram);
      }
      
      await render();
      
      // Focus input at the end
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);
    }

    window.addEventListener('resize', resize);
    
    input.addEventListener('beforeinput', (e) => {
      if (e.inputType === 'insertText' && e.data) {
        const transformed = e.data.toUpperCase();
        let hasInvalid = false;
        
        for (const char of transformed) {
          if (!isValidChar(char)) {
            hasInvalid = true;
            break;
          }
        }
        
        if (hasInvalid) {
          e.preventDefault();
          visualBell();
          return;
        }
        
        if (transformed !== e.data) {
          e.preventDefault();
          const start = input.selectionStart;
          const end = input.selectionEnd;
          const before = input.value.substring(0, start);
          const after = input.value.substring(end);
          input.value = before + transformed + after;
          input.selectionStart = input.selectionEnd = start + transformed.length;
          updateURL(input.value);
          render();
        }
      }
    });
    
    input.addEventListener('input', () => {
      updateURL(input.value);
      render();
      updateHelpDisplay();
    });
    
    input.addEventListener('keyup', () => {
      updateUploadButtonState();
      updateHelpDisplay();
    });
    input.addEventListener('mouseup', () => {
      updateUploadButtonState();
      updateHelpDisplay();
    });
    input.addEventListener('focus', () => {
      updateUploadButtonState();
      updateHelpDisplay();
    });
    

    
    input.addEventListener('paste', async (e) => {
      const items = e.clipboardData?.items;
      if (!items) return;
      
      for (const item of items) {
        if (item.type.startsWith('image/')) {
          e.preventDefault();
          const blob = item.getAsFile();
          if (blob) {
            await handleImageUpload(blob);
          }
          return;
        }
      }
    });

    window.addEventListener('popstate', async (event) => {
      await loadProgramFromURL();
    });
    
    // Start intro immediately if needed, load models in background
    if (shouldShowIntro()) {
      resize();
      showIntro();
      modelsReady = Promise.all([emeraldReady, bgRemovalReady]);
    } else {
      app.classList.remove('intro-active');
      Promise.all([emeraldReady, bgRemovalReady]).then(async () => {
        resize();
        await loadProgramFromURL();
      });
    }
  </script>
</body>
</html>
